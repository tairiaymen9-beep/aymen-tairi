<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="form-card">

            <div class="form-header">
                <div class="logo">✦</div>
                <h1>Créer un compte</h1>
                <p>Rejoignez-nous et créez votre compte.</p>
            </div>

            <form action="#" method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom"
                               placeholder="Votre nom" required>
                    </div>

                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom"
                               placeholder="Votre prénom" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email"
                           placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone"
                           placeholder="06 00 00 00 00" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date de naissance</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <select id="genre" name="genre" required>
                            <option value="">Choisir</option>
                            <option value="homme">Homme</option>
                            <option value="femme">Femme</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="niveau">Niveau d'études</label>
                    <select id="niveau" name="niveau" required>
                        <option value="">Choisir votre niveau</option>
                        <option value="college">Collège</option>
                        <option value="lycee">Lycée</option>
                        <option value="bac">Baccalauréat</option>
                        <option value="universite">Université</option>
                        <option value="autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password"
                           name="password" minlength="8"
                           placeholder="Minimum 8 caractères" required>
                </div>

                <div class="form-group">
                    <label for="confirm">Confirmer le mot de passe</label>
                    <input type="password" id="confirm"
                           name="confirm" minlength="8"
                           placeholder="Confirmez votre mot de passe"
                           required>
                </div>

                <div class="terms">
                    <input type="checkbox" id="conditions"
                           name="conditions" required>
                    <label for="conditions">
                        J'accepte les conditions d'utilisation.
                    </label>
                </div>

                <button type="submit">Créer mon compte →</button>

                <p class="login-text">
                    Vous avez déjà un compte ?
                    <a href="#">Se connecter</a>
                </p>

            </form>
        </section>

        <footer>© 2026 - Mon projet HTML & CSS</footer>
    </main>

</body>
</html>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
